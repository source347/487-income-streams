        const streamsContainer = document.getElementById('streamsContainer');

        // Function to render the full list or filtered list
        function renderStreams(data, searchTerm = '') {
            streamsContainer.innerHTML = '';
            const lowerCaseSearchTerm = searchTerm.toLowerCase();
            let foundCount = 0;

            for (const category in data) {
                const filteredStreams = data[category].filter(stream =>
                    stream.toLowerCase().includes(lowerCaseSearchTerm)
                );

                if (filteredStreams.length > 0) {
                    foundCount += filteredStreams.length;

                    // Category Card (Collapsible)
                    const categoryCard = document.createElement('div');
                    categoryCard.className = `category-card bg-white p-6 rounded-xl shadow-lg`;

                    // Category Header (Clickable for collapse/expand)
                    const header = document.createElement('div');
                    // Add 'pointer-events-none' if a search term is active to prevent accidental collapse when trying to view filtered results
                    const isSearching = searchTerm.length > 0;
                    header.className = `category-header flex justify-between items-center cursor-pointer border-b pb-4 mb-4 ${isSearching ? 'border-indigo-400' : 'border-gray-200'} transition-all duration-300`;
                    header.innerHTML = `
                        <h2 class="text-xl sm:text-2xl font-bold text-indigo-700">${category.split('(')[0].trim()} <span class="text-sm font-medium text-gray-500">(${filteredStreams.length} found)</span></h2>
                        <svg class="w-6 h-6 text-indigo-600 transform transition-transform ${isSearching ? 'rotate-180' : ''}" data-toggle="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    `;
                    // Only attach click handler if not actively searching, forcing open view when searching
                    if (!isSearching) {
                        header.onclick = () => toggleCollapse(categoryCard.querySelector('[data-content]'), header.querySelector('[data-toggle="icon"]'));
                    }
                    categoryCard.appendChild(header);

                    // Stream List Content
                    const content = document.createElement('ul');
                    // Show expanded if searching, otherwise collapsed
                    content.className = `space-y-3 ${isSearching ? '' : 'hidden'}`;
                    content.setAttribute('data-content', true);

                    filteredStreams.forEach(stream => {
                        const listItem = document.createElement('li');
                        // Highlight the search term if present
                        let displayStream = stream;
                        if (searchTerm) {
                            const regex = new RegExp(`(${searchTerm})`, 'gi');
                            displayStream = stream.replace(regex, '<span class="bg-yellow-200 font-semibold rounded px-1">$1</span>');
                        }

                        listItem.className = 'stream-item p-3 bg-indigo-50 text-gray-800 rounded-lg transition duration-200 ease-in-out cursor-default text-base leading-relaxed';
                        listItem.innerHTML = displayStream;
                        content.appendChild(listItem);
                    });

                    categoryCard.appendChild(content);
                    streamsContainer.appendChild(categoryCard);
                }
            }

            // Show message if no streams are found
            if (searchTerm && foundCount === 0) {
                 streamsContainer.innerHTML = `
                    <div class="text-center p-12 bg-white rounded-xl shadow-lg mt-8">
                        <svg class="w-16 h-16 mx-auto text-red-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172A4 4 0 0112 11.586v-1.586m0 6a4 4 0 100-8 4 4 0 00-4 4 4 4 0 004 4z"></path></svg>
                        <h3 class="text-xl font-semibold text-gray-700">No matching income streams found.</h3>
                        <p class="text-gray-500">Try a different keyword or check your spelling. Remember there are 487 unique ideas!</p>
                    </div>
                `;
            } else if (!searchTerm) {
                // If not searching, display the total count in the header for clarity
                const totalStreams = Object.values(data).flat().length;
                document.querySelector('p.text-xl').innerHTML = `Explore a comprehensive list of <span class="font-semibold text-indigo-700">${totalStreams}</span> ideas for financial diversification.`;
            }
        }

        // Toggle visibility of content and rotate the arrow icon
        function toggleCollapse(contentElement, iconElement) {
            contentElement.classList.toggle('hidden');
            iconElement.classList.toggle('rotate-180');
        }

        // Filter function triggered by input
        function filterStreams(searchTerm) {
            renderStreams(allStreamsData, searchTerm.trim());
        }

        // Initial render on page load
        document.addEventListener('DOMContentLoaded', () => {
            renderStreams(allStreamsData);
        });
    </script>
